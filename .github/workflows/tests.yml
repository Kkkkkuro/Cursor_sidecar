name: Sidecar tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Bundle and unit tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          SIDECAR_TEST_TMP: ${{ runner.temp }}/sidecar-tests
        run: |
          mkdir -p "$SIDECAR_TEST_TMP"
          python3 scripts/install-skill.py --check
          python3 -m unittest discover -s tests -v
      - name: Installed wrapper smoke
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tmux
          python3 scripts/install-skill.py --dest /tmp/sidecar-ci-skill
          python3 smoke/check-so19.py --wrapper /tmp/sidecar-ci-skill/scripts/run-agent-with-tmux-signal.py --run-dir /tmp/sc-normal --mode normal
          python3 smoke/check-so19.py --wrapper /tmp/sidecar-ci-skill/scripts/run-agent-with-tmux-signal.py --run-dir /tmp/sc-timeout --mode timeout
